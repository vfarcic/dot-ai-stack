name: Release Helm Chart

on:
  push:
    branches:
      - main
    # Tooling-only changes don't affect the chart, so they don't publish a release
    paths-ignore:
      - devbox.json
      - devbox.lock
      - renovate.json
      - .github/**

# Run releases one at a time so back-to-back merges don't race on the version-bump push
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Check out the tip of main, not the triggering commit, so a queued run
          # includes the version bump pushed by the run before it
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Bump chart version
        id: bump
        run: |
          # Read current version
          CURRENT_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

          # Increment minor, reset patch
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          echo "New version: $NEW_VERSION"

          # Update Chart.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$NEW_VERSION\"/" Chart.yaml

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Chart.yaml
          git commit -m "chore: bump chart version to ${{ steps.bump.outputs.version }} [skip ci]"
          # A tooling-only commit can reach main after checkout. It doesn't trigger
          # its own release, so rebase onto it and retry instead of failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "Failed to push version bump after 3 attempts"
          exit 1

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update dependencies
        run: helm dependency update

      - name: Package chart
        run: helm package .

      - name: Push to GHCR
        run: |
          helm push dot-ai-stack-*.tgz oci://ghcr.io/vfarcic/dot-ai-stack/charts

      - name: Check if docs changed
        id: docs-check
        run: |
          # Compare everything since the previous release's version bump, not just one
          # commit: a run can include several commits, some of them tooling-only.
          PREV_RELEASE=$(git log -1 --format=%H --grep='^chore: bump chart version' HEAD~1 || true)
          if [ -n "$PREV_RELEASE" ]; then
            DOCS_CHANGED=$(git diff --name-only "$PREV_RELEASE" HEAD~1 -- README.md docs/ | wc -l)
          else
            DOCS_CHANGED=1  # No previous release found, trigger rebuild
          fi
          if [ "$DOCS_CHANGED" -gt 0 ]; then
            echo "docs-changed=true" >> $GITHUB_OUTPUT
          else
            echo "docs-changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Website Rebuild
        if: steps.docs-check.outputs.docs-changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: vfarcic/dot-ai-website
          event-type: upstream-release
          client-payload: '{"source": "dot-ai-stack"}'
